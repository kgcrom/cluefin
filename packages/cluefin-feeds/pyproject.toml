[project]
name = "cluefin-feeds"
version = "0.1.0"
description = "Clients for public data feeds and files outside broker APIs: U.S. Treasury rates, BLS series, Damodaran datasets"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hangoo Kang", email = "kgcrom@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.12.0,<3.0.0",
    "requests>=2.32.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../../pyproject.toml"
include = ["src/**", "tests/**"]
extend-exclude = ["*.xml", "*.html", "*.xls"]
