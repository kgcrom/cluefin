[project]
name = "cluefin-desk"
version = "0.1.0"
description = "Interactive TUI dashboard for Korean stock market analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cluefin-openapi",
    "cluefin-ta",
    "cluefin-xbrl",
    "textual>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.12.0,<3.0.0",
    "loguru>=0.7.3",
    "plotext>=5.2.8",
    "rich>=13.7.0",
    "lightgbm>=4.0.0,<5.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "shap>=0.47.2,<1.0.0",
    "imbalanced-learn>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cluefin-desk = "cluefin_desk.app:main"

[tool.ruff]
extend = "../../pyproject.toml"
include = ["src/**", "tests/**"]
extend-exclude = ["*.tcss"]
