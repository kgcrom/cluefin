name: CI Pipeline

"on":
  push:
    branches: [ main ]
    # 문서만 바뀐 커밋과 TS 패키지(ci-openapi-ts.yml 이 따로 돈다)는 건너뛴다.
    # CLI 테스트가 읽는 README·AGENTS 는 다시 넣는다(뒤 패턴이 앞 패턴을 덮는다).
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!packages/cluefin-openapi-ts/**'
      - 'apps/cluefin-openapi-cli/README.md'
      - 'apps/cluefin-openapi-cli/AGENTS.md'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: "3.11"

# 연달아 머지되면 앞 커밋의 실행은 취소하고 마지막 커밋만 끝까지 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: lint
        
    - name: Install dependencies
      run: |
        uv sync --dev --locked
        
    - name: Run ruff linter
      run: |
        uv run ruff check .
        
    - name: Run ruff formatter check
      run: |
        uv run ruff format --check .

  # 대상 패키지는 루트 pyproject.toml 의 [tool.pyright] include. import 를 따라가야 하므로 전체를 설치한다.
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    environment: development

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: typecheck

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --locked

    - name: Run pyright
      run: |
        uv run pyright

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    environment: development
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: ${{ matrix.python-version }}
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --locked

    - name: Run unit tests
      if: matrix.python-version != env.PYTHON_VERSION
      run: |
        uv run pytest -m "not integration and not slow"

    # 커버리지는 PYTHON_VERSION 칸에서 같은 단위 테스트를 coverage 로 돌려 얻는다.
    # 따로 잡을 두면 같은 테스트를 새 러너에서 설치부터 한 번 더 돌게 된다.
    - name: Run unit tests with coverage
      if: matrix.python-version == env.PYTHON_VERSION
      run: |
        uv run coverage run -m pytest -m "not integration and not slow"
        uv run coverage xml

    - name: Upload coverage to Codacy
      if: matrix.python-version == env.PYTHON_VERSION
      env:
        CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        CODACY_ORGANIZATION_PROVIDER: gh
        CODACY_USERNAME: kgcrom
        CODACY_PROJECT_NAME: cluefin
      run: |
        bash <(curl -Ls https://coverage.codacy.com/get.sh) report -l Python -r coverage.xml
