name: CI Pipeline

"on":
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: lint
        
    - name: Install dependencies
      run: |
        uv sync --dev --locked
        
    - name: Run ruff linter
      run: |
        uv run ruff check .
        
    - name: Run ruff formatter check
      run: |
        uv run ruff format --check .

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    environment: development
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: ${{ matrix.python-version }}
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --locked

    - name: Create test environment file
      run: |
        cp packages/cluefin-openapi/.env.sample packages/cluefin-openapi/.env
        
    - name: Run unit tests
      if: matrix.python-version != env.PYTHON_VERSION
      env:
        # Environment variables
        TEST_ENVIRONMENT: ${{ vars.TEST_ENVIRONMENT || 'development' }}
        LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        ENABLE_INTEGRATION_TESTS: ${{ vars.ENABLE_INTEGRATION_TESTS || 'false' }}
      run: |
        uv run pytest -m "not integration and not slow"

    # 커버리지는 PYTHON_VERSION 칸에서 같은 단위 테스트를 coverage 로 돌려 얻는다.
    # 따로 잡을 두면 같은 테스트를 새 러너에서 설치부터 한 번 더 돌게 된다.
    - name: Run unit tests with coverage
      if: matrix.python-version == env.PYTHON_VERSION
      run: |
        uv run coverage run -m pytest -m "not integration and not slow"
        uv run coverage xml

    - name: Upload coverage to Codacy
      if: matrix.python-version == env.PYTHON_VERSION
      env:
        CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        CODACY_ORGANIZATION_PROVIDER: gh
        CODACY_USERNAME: kgcrom
        CODACY_PROJECT_NAME: cluefin
      run: |
        bash <(curl -Ls https://coverage.codacy.com/get.sh) report -l Python -r coverage.xml

    - name: Run integration tests
      if: vars.ENABLE_INTEGRATION_TESTS == 'true'
      env:
        KIWOOM_API_KEY: ${{ secrets.KIWOOM_API_KEY }}
        KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        TEST_ENVIRONMENT: ${{ vars.TEST_ENVIRONMENT || 'development' }}
        LOG_LEVEL: ${{ vars.LOG_LEVEL || 'DEBUG' }}
      run: |
        uv run pytest -m "integration" -v --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-suffix: security
        
    - name: Install dependencies
      run: |
        uv sync --all-packages --locked
        
    - name: Run pip-audit vulnerability scan
      run: |
        uv tool install pip-audit
        uv run pip-audit --desc --format json --output pip-audit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          pip-audit-report.json

  openapi-ts:
    name: cluefin-openapi-ts (build, lint, typecheck, unit test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/cluefin-openapi-ts

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: packages/cluefin-openapi-ts/package-lock.json

    - name: Install dependencies
      run: npm ci

    # npm publish 직전에 도는 것과 같은 게이트: build → biome check → typecheck → unit test
    - name: Run publish check
      run: npm run publish:check

  notify:
    name: Notify Status
    runs-on: ubuntu-24.04
    needs: [lint, test, security, openapi-ts]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.lint.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' && needs.openapi-ts.result == 'success'
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        echo "All checks passed successfully!"
        if [ -n "$SLACK_WEBHOOK" ]; then
          echo "Would notify Slack (webhook configured)"
        fi
        
    - name: Notify failure
      if: needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' || needs.openapi-ts.result == 'failure'
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        echo "Some checks failed!"
        if [ -n "$SLACK_WEBHOOK" ]; then
          echo "Would notify Slack about failure (webhook configured)"
        fi
