name: Publish cluefin-openapi

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - micro
          - minor
          - major

env:
  PYTHON_VERSION: "3.10"
  PACKAGE_DIR: packages/cluefin-openapi

jobs:
  publish:
    name: Bump Version, Build & Publish
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # 배포본이 CI 에서 테스트한 의존성 버전 그대로 빌드되도록, bump 전에 lock 이 최신인지 확인한다.
      - name: Check lockfile
        run: uv lock --check

      - name: Bump version
        id: bump
        run: |
          current=$(grep '^version' ${{ env.PACKAGE_DIR }}/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r major minor micro <<< "$current"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; micro=0 ;;
            minor) minor=$((minor + 1)); micro=0 ;;
            micro) micro=$((micro + 1)) ;;
          esac

          new_version="${major}.${minor}.${micro}"
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" ${{ env.PACKAGE_DIR }}/pyproject.toml

          echo "old_version=$current" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $current -> $new_version"

      # bump 로 바뀐 워크스페이스 버전만 lock 에 반영하고(다른 의존성은 lock 값 유지), 그 lock 으로 설치한다.
      - name: Install dependencies
        run: |
          uv lock
          uv sync --all-packages --locked

      - name: Run tests
        run: uv run pytest ${{ env.PACKAGE_DIR }}/tests -m "not integration and not slow"

      - name: Build package
        run: uv build --package cluefin-openapi

      # Trusted Publishing(OIDC): PyPI 에 이 워크플로가 publisher 로 등록돼 있어(repo kgcrom/cluefin,
      # workflow publish-openapi.yml, environment development) 장기 API 토큰(password)이 필요 없다.
      # permissions 의 id-token: write 와 위 environment 이름이 등록값과 정확히 같아야 한다.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PACKAGE_DIR }}/pyproject.toml uv.lock
          git commit -m "release(openapi): v${{ steps.bump.outputs.new_version }}"
          git tag "cluefin-openapi/v${{ steps.bump.outputs.new_version }}"
          git push origin main --tags

      # GITHUB_TOKEN 으로 한 push 는 CI 의 push 트리거를 발동시키지 않는다.
      # 그대로 두면 main HEAD(릴리스 커밋)에 Codacy 커버리지가 없어 배지가 0% 가 되므로
      # workflow_dispatch(GITHUB_TOKEN 으로도 발동됨)로 CI 를 직접 돌린다.
      - name: Trigger CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
