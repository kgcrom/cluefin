pre-commit:
  parallel: true
  commands:
    python-lint:
      glob: "*.py"
      run: uv run ruff format --check {staged_files} && uv run ruff check --no-fix {staged_files}
    node-lint:
      glob: "*.{ts,tsx,js}"
      root: "packages/cluefin-openapi-ts/"
      run: npx biome check {staged_files}

pre-push:
  parallel: true
  commands:
    python-test:
      glob: "*.py"
      run: uv run pytest -m "not integration and not slow" --tb=short -q
    # 바뀐 파일만 보면 손대지 않은 호출부 오류를 놓친다(#196). 그래서 include 전체를 본다.
    python-typecheck:
      glob: ["*.py", "pyproject.toml"]
      run: uv run pyright
    node-test:
      glob: "*.{ts,tsx,js}"
      root: "packages/cluefin-openapi-ts/"
      run: npm run test:unit
